# This workflow builds and validates a complete LunaGC resource cache.
#
# Pull requests are tested, but only commits merged or pushed to master
# update the rolling release.

name: Build LunaGC Resource Cache

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

  workflow_dispatch:

concurrency:
  group: lunagc-6.6-resource-cache
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Check out resources repository
      uses: actions/checkout@v4
      with:
        path: resources
        fetch-depth: 0

    - name: Check out LunaGC server repository
      uses: actions/checkout@v4
      with:
        repository: Rafs-kk/LunaGC-6.6
        ref: 6.6.0
        path: server
        fetch-depth: 1

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Allow Gradle wrapper execution
      working-directory: server
      run: chmod +x gradlew

    - name: Read commit information
      id: commits
      shell: bash
      run: |
        RESOURCE_COMMIT="$(git -C resources rev-parse HEAD)"
        SERVER_COMMIT="$(git -C server rev-parse HEAD)"

        echo "resource_commit=${RESOURCE_COMMIT}" >> "$GITHUB_OUTPUT"
        echo "server_commit=${SERVER_COMMIT}" >> "$GITHUB_OUTPUT"

    - name: Build complete resource cache
      working-directory: server
      run: |
        ./gradlew buildResourceCache \
          -PskipHandbook=1 \
          -PresourcesDir="${GITHUB_WORKSPACE}/resources" \
          -PcacheOutput="${GITHUB_WORKSPACE}/LunaGC-6.6-resources.cache" \
          -PresourcesCommit="${{ steps.commits.outputs.resource_commit }}" \
          -PserverCommit="${{ steps.commits.outputs.server_commit }}"

    - name: Validate resource cache
      working-directory: server
      run: |
        ./gradlew validateResourceCache \
          -PcacheInput="${GITHUB_WORKSPACE}/LunaGC-6.6-resources.cache"

    - name: Verify generated cache
      shell: bash
      run: |
        test -s LunaGC-6.6-resources.cache

        echo "Generated cache:"
        ls -lh LunaGC-6.6-resources.cache

        echo "SHA-256:"
        sha256sum LunaGC-6.6-resources.cache

    - name: Archive cache from this workflow run
      uses: actions/upload-artifact@v4
      with:
        name: LunaGC-6.6-resources-${{ github.sha }}
        path: LunaGC-6.6-resources.cache
        if-no-files-found: error
        retention-days: 30

    - name: Publish rolling resource-cache release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: |
        RESOURCE_COMMIT="${{ steps.commits.outputs.resource_commit }}"
        SERVER_COMMIT="${{ steps.commits.outputs.server_commit }}"
        CACHE_SHA256="$(sha256sum LunaGC-6.6-resources.cache | cut -d ' ' -f 1)"

        gh release delete latest-cache \
          --cleanup-tag \
          --yes || true

        gh release create latest-cache \
          LunaGC-6.6-resources.cache \
          --target "${GITHUB_SHA}" \
          --title "Latest LunaGC 6.6 Resource Cache" \
          --notes "Automatically generated complete LunaGC resource cache.

        Resources commit: ${RESOURCE_COMMIT}
        Server compiler commit: ${SERVER_COMMIT}
        SHA-256: ${CACHE_SHA256}" \
          --prerelease \
          --latest=false
